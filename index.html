<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Envíos - USDTz</title>
    <!-- Carga de Ethers.js desde CDN oficial -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #38bdf8; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #94a3b8; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #0ea5e9; }
        #status { margin-top: 15px; font-size: 13px; text-align: center; word-break: break-all; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Panel USDTz</h2>
        
        <label for="contractSelect">Seleccionar Contrato:</label>
        <select id="contractSelect">
            <option value="0x4be35ec329343d7d9f548d42b0f8c17fffe07db4">Contrato 1 (Suministro Total - 9B)</option>
            <option value="0x9da3a065920797f2fca6bc5864bb6d7ea6a34331">Contrato 2 (Circulante - 6B)</option>
        </select>

        <label for="recipient">Dirección Destino:</label>
        <input type="text" id="recipient" placeholder="0x...">

        <label for="amount">Cantidad:</label>
        <input type="number" id="amount" placeholder="0.0">

        <button onclick="enviarTokens()">Conectar y Enviar</button>

        <div id="status"></div>
    </div>

    <script>
        // ABI básico estándar ERC-20 para transferencias
        const minABI = [
            "function transfer(address to, uint amount) public returns (bool)"
        ];

        async function enviarTokens() {
            const statusDiv = document.getElementById("status");
            
            if (typeof window.ethereum === 'undefined') {
                statusDiv.innerHTML = "<span style='color: #ef4444;'>Por favor, abre esta página desde una billetera Web3 (como MetaMask o Trust Wallet).</span>";
                return;
            }

            try {
                statusDiv.innerText = "Conectando a la billetera...";
                
                // Solicitar conexión a la red y cuenta del usuario
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                
                // Verificar que estemos en BNB Smart Chain (Chain ID: 56)
                const network = await provider.getNetwork();
                if (network.chainId !== 56) {
                    statusDiv.innerHTML = "<span style='color: #f59e0b;'>Cambia tu red a BNB Smart Chain en tu billetera.</span>";
                    return;
                }

                const signer = provider.getSigner();
                const contractAddress = document.getElementById("contractSelect").value;
                const recipient = document.getElementById("recipient").value;
                const rawAmount = document.getElementById("amount").value;

                if (!recipient || !rawAmount) {
                    statusDiv.innerHTML = "<span style='color: #ef4444;'>Completa todos los campos.</span>";
                    return;
                }

                statusDiv.innerText = "Preparando transacción...";
                const contract = new ethers.Contract(contractAddress, minABI, signer);
                
                // Asumiendo 18 decimales estándar para el token
                const amount = ethers.utils.parseUnits(rawAmount, 18);

                statusDiv.innerText = "Confirma la transacción en tu billetera...";
                const tx = await contract.transfer(recipient, amount);

                statusDiv.innerText = "Transacción enviada. Esperando confirmación...";
                await tx.wait();

                statusDiv.innerHTML = `<span style='color: #22c55e;'>¡Envío exitoso! Hash: ${tx.hash}</span>`;
            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = `<span style='color: #ef4444;'>Error: ${error.message || error}</span>`;
            }
        }
    </script>
</body>
</html>
